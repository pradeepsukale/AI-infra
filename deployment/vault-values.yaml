server:
  dev:
    enabled: false
  standalone:
    enabled: true
    config: |
      ui = true
      listener "tcp" {
        tls_disable = 1
        address = "[::]:8200"
        cluster_address = "[::]:8201"
      }
      storage "postgresql" {
        connection_url = "postgres://vault:vaultpassword@shared-postgres.default.svc.cluster.local:5432/vaultdb?sslmode=disable"
      }
