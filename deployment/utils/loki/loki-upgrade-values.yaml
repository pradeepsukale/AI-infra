deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  storage:
    type: s3
    bucketNames:
      chunks: chunks
      ruler: ruler
      admin: admin
    s3:
      endpoint: http://loki-new-minio.monitoring.svc.cluster.local:9000
      accessKeyId: root-user
      secretAccessKey: supersecretpassword
      s3ForcePathStyle: true
      insecure: true

minio:
  enabled: true
  persistence:
    enabled: true
    size: 10Gi

gateway:
  enabled: true

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 10Gi

# Explicitly zero out all other deployment modes
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0
ingester:
  replicas: 0
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
distributor:
  replicas: 0
compactor:
  replicas: 0
indexGateway:
  replicas: 0
