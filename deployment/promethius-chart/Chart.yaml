apiVersion: v2
name: promethius-app
description: A Helm chart for the Promethius application stack (frontend, backend, otel, jaeger)
type: application
version: 0.1.0
appVersion: "1.0.0"

dependencies:
  - name: kube-prometheus-stack
    version: ">=50.0.0"
    repository: "https://prometheus-community.github.io/helm-charts"
    condition: kube-prometheus-stack.enabled
  - name: loki
    version: ">=5.0.0"
    repository: "https://grafana.github.io/helm-charts"
    condition: loki.enabled
  - name: tempo
    version: ">=1.0.0"
    repository: "https://grafana.github.io/helm-charts"
    condition: tempo.enabled
